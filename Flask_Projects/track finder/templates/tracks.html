{% extends "base.html" %}

{% block title %}Track Finder - Tracks{% endblock %}

{% block content %}
    <h1> {{site_name}}</h1>
    <ul>
        {% for track in tracks %}
            <li>
                {{track.name}}  -  {{track.length}}
                {% if track.grade == "Hard" %}
                    <strong>(challenging)</strong>
                {% endif %}
            </li>
        {% endfor %}
        <img src="{{url_for('static', filename='images/karekare_falls.jpg')}}">
    </ul>
{% endblock %}
