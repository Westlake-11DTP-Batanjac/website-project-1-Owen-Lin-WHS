</head>

            <h1>{% block title %}{% endblock %}</h1>
        </div>
        
        <div id="tabs">

    <div id="background">

    </div>
    <div id="footer">
        <p>| Private Policy |</p>
        <p>| Terms of Use |</p>
        <p>| Legal |</p>
        <p>| Support (name) |</p>
