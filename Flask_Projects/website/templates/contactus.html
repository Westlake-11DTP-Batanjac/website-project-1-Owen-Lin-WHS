{% extends "base.html" %}

{% block title %} Contact Us {% endblock %}

{% block content %}
    <div id="supportholder">
        <div class="supporttab">
            <form action="{{url_for('new_contact_message')}}" method="POST">
                <label for="fname" class="info">First Name:</label>
                <label for="lname" class="info">Last Name:</label>
                <label for="email" class="info">Email:</label>
                <input class="textinfo" type="text" name="fname" value="" maxlength="20" required>
                <input class="textinfo" type="text" name="lname" value="" maxlength="20" required>
                <input class="textinfo" type="text" name="email" value="">
                <label for="message" class="info" style="width:100%;">Message:</label>
                <input id="textmsg" type="text" name="message" value="" maxlength="500" required>
                <button type="submit" style="width:100%">Send it</button>
            </form>
        </div>
    </div>
{% endblock %}
